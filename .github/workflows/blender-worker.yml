# Builds the Blender worker image and deploys it to Cloud Run (Mumbai) on changes under
# workers/blender. Auth is keyless (Workload Identity Federation, set up by
# workers/blender/setup-gcp.sh); nothing secret lives in this repo.
name: Blender worker

on:
  push:
    branches: [main]
    paths: ['workers/blender/**', '.github/workflows/blender-worker.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: interior-studio-512608
  PROJECT_NUMBER: ''
  REGION: asia-south1
  SERVICE: blender-worker
  SUPABASE_URL: https://pkbctmaiawztzmwqkpgw.supabase.co
  # Public (publishable) key, the same one the web app ships.
  SUPABASE_ANON_KEY: sb_publishable_KpNjQ1QaBf1PaMi_aTuEIg_-5taFJ86
  ALLOWED_ORIGINS: https://interior-studio-two.vercel.app,http://localhost:5173

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.c.outputs.ready }}
    steps:
      - id: c
        run: |
          if [ -n "$PROJECT_NUMBER" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Run workers/blender/setup-gcp.sh and set PROJECT_NUMBER first."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/studio/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" workers/blender
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" \
            --service-account "blender-worker@${PROJECT_ID}.iam.gserviceaccount.com" \
            --execution-environment gen2 --cpu 8 --memory 16Gi --cpu-boost \
            --concurrency 1 --timeout 3600 --min-instances 0 --max-instances 3 \
            --allow-unauthenticated \
            --set-env-vars "^@^SUPABASE_URL=${SUPABASE_URL}@SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}@ALLOWED_ORIGINS=${ALLOWED_ORIGINS}"
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          echo "Worker URL: $URL"
          curl -fsS "$URL/health"
