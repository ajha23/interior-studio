name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Unit and property tests
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pkbctmaiawztzmwqkpgw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_KpNjQ1QaBf1PaMi_aTuEIg_-5taFJ86
