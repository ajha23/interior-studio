<!-- Spec 054: sign-in email (returning users). Same body as confirmation.html; keep them identical.
     Production: paste into Supabase → Authentication → Email Templates → "Magic Link" (docs/auth.md). -->
<div style="margin:0;padding:24px 0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:8px;padding:32px;">
    <p style="margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#71717a;">Interior Studio</p>
    <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;">Sign in to Interior Studio</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">Click the button to sign in, on this device or any other.</p>
    <p style="margin:0 0 28px;">
      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 20px;border-radius:6px;">Sign in to Interior Studio</a>
    </p>
    <p style="margin:0 0 8px;font-size:15px;line-height:1.5;">Or enter this code on the sign-in screen:</p>
    <p style="margin:0 0 28px;font-size:32px;font-weight:700;letter-spacing:0.2em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#52525b;">The link and code work once, for 15 minutes.</p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#52525b;">If you didn't ask for this, ignore this email.</p>
  </div>
</div>
